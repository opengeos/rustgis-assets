<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RustGIS Assets</title>
<meta name="description" content="Static assets for RustGIS: images, sample data and fonts.">
<link rel="icon" href="images/favicon.png" type="image/png">
<style>
  :root {
    --bg: #fafaf9;
    --fg: #1c1917;
    --muted: #78716c;
    --line: #e7e5e4;
    --card: #ffffff;
    --accent: #c2410c;
    --hover: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09;
      --fg: #f5f5f4;
      --muted: #a8a29e;
      --line: #292524;
      --card: #1c1917;
      --accent: #fb923c;
      --hover: #292524;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  header img { width: 48px; height: 48px; }
  h1 { font-size: 26px; margin: 0; }
  .intro { color: var(--muted); margin: 0 0 28px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  input {
    width: 100%; padding: 9px 12px; margin-bottom: 24px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--fg); font: inherit;
  }
  section { margin-bottom: 28px; }
  h2 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  h2 span { color: var(--muted); font-weight: 400; font-size: 13px; }
  ul {
    list-style: none; margin: 0; padding: 0;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); overflow: hidden;
  }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-top: 1px solid var(--line);
  }
  li:first-child { border-top: 0; }
  li:hover { background: var(--hover); }
  li a { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .size { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  button {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 6px; padding: 2px 8px; font: 12px inherit; cursor: pointer;
  }
  button:hover { color: var(--fg); }
  .status { color: var(--muted); }
  footer { color: var(--muted); font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="images/logo.svg" alt="">
    <h1>RustGIS Assets</h1>
  </header>
  <p class="intro">
    Static assets for <a href="https://github.com/opengeos/RustGIS">RustGIS</a>.
    Every file in the <a href="https://github.com/opengeos/rustgis-assets">repository</a>
    is served at the matching path, e.g. <code>https://assets.rustgis.app/images/logo.svg</code>.
  </p>
  <input id="filter" type="search" placeholder="Filter files…" aria-label="Filter files">
  <div id="list"><p class="status">Loading file list…</p></div>
  <footer>
    Released under the <a href="LICENSE">Apache License 2.0</a>; fonts under the
    <a href="fonts/OFL.txt">SIL Open Font License</a>.
  </footer>
</main>
<script>
  // The list is read from the GitHub API so it stays current without a build step.
  const REPO = "opengeos/rustgis-assets";
  const HIDDEN = new Set([".gitignore", ".nojekyll", "CNAME", "index.html", ".gitkeep"]);
  const list = document.getElementById("list");
  const filter = document.getElementById("filter");
  let groups = new Map();

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    const units = ["KB", "MB", "GB"];
    let i = -1;
    do { bytes /= 1024; i++; } while (bytes >= 1024 && i < units.length - 1);
    return bytes.toFixed(bytes < 10 ? 1 : 0) + " " + units[i];
  }

  function render() {
    const q = filter.value.trim().toLowerCase();
    list.replaceChildren();
    for (const [dir, files] of groups) {
      const shown = files.filter(f => f.path.toLowerCase().includes(q));
      if (!shown.length) continue;
      const section = document.createElement("section");
      const h2 = document.createElement("h2");
      h2.textContent = dir === "" ? "/" : dir + "/";
      const count = document.createElement("span");
      count.textContent = shown.length + (shown.length === 1 ? " file" : " files");
      h2.append(count);
      const ul = document.createElement("ul");
      for (const f of shown) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = f.path;
        a.textContent = f.path.slice(dir ? dir.length + 1 : 0);
        const size = document.createElement("span");
        size.className = "size";
        size.textContent = formatSize(f.size);
        const copy = document.createElement("button");
        copy.textContent = "Copy URL";
        copy.onclick = async () => {
          try {
            await navigator.clipboard.writeText(new URL(f.path, location.href).href);
            copy.textContent = "Copied";
          } catch {
            copy.textContent = "Failed";
          }
          setTimeout(() => (copy.textContent = "Copy URL"), 1200);
        };
        li.append(a, size, copy);
        ul.append(li);
      }
      section.append(h2, ul);
      list.append(section);
    }
    if (!list.children.length) {
      list.innerHTML = '<p class="status">No matching files.</p>';
    }
  }

  fetch(`https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`)
    .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
    .then(data => {
      const files = data.tree
        .filter(e => e.type === "blob")
        .filter(e => !HIDDEN.has(e.path.split("/").pop()) && !e.path.startsWith(".github/"));
      for (const f of files) {
        const dir = f.path.includes("/") ? f.path.slice(0, f.path.lastIndexOf("/")) : "";
        if (!groups.has(dir)) groups.set(dir, []);
        groups.get(dir).push(f);
      }
      // Directories first (alphabetical), root files last.
      groups = new Map([...groups].sort(([a], [b]) =>
        (a === "") - (b === "") || a.localeCompare(b)));
      render();
    })
    .catch(() => {
      list.innerHTML = `<p class="status">Could not load the file list from GitHub.
        Browse it on <a href="https://github.com/${REPO}">GitHub</a> instead.</p>`;
    });
  filter.addEventListener("input", render);
</script>
</body>
</html>
